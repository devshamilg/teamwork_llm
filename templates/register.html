<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Teamwork LLM</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="page">
    <main class="centered">
      <div class="card">
        <h1 class="card-title">Create Account</h1>
        <p class="card-subtitle">Join Teamwork LLM</p>

        <div id="error-box" class="alert-error"></div>

        <form id="register-form">
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input class="input" type="text" id="username" required maxlength="50" placeholder="johndoe" />
          </div>
          <div class="form-group">
            <label class="form-label" for="display_name">Display Name</label>
            <input class="input" type="text" id="display_name" required maxlength="100" placeholder="John Doe" />
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input class="input" type="email" id="email" required placeholder="you@example.com" />
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="input" type="password" id="password" required placeholder="••••••••" />
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">Register</button>
        </form>

        <div class="form-footer">
          Already have an account? <a href="/login">Sign In</a> &middot; <a href="/">Home</a>
        </div>
      </div>
    </main>
  </div>

  <script>
    if (localStorage.getItem("access_token")) {
      window.location.href = "/home";
    }

    const form = document.getElementById("register-form");
    const errorBox = document.getElementById("error-box");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Creating account...";

      const payload = {
        username: document.getElementById("username").value.trim(),
        display_name: document.getElementById("display_name").value.trim(),
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
      };

      try {
        const res = await fetch("/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          const detail = typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail || "Registration failed");
          throw new Error(detail);
        }

        // Automatically log the user in after registration
        const loginBody = new URLSearchParams();
        loginBody.append("username", payload.email);
        loginBody.append("password", payload.password);

        const loginRes = await fetch("/auth/jwt/login", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: loginBody.toString(),
        });

        if (loginRes.ok) {
          const loginData = await loginRes.json();
          localStorage.setItem("access_token", loginData.access_token);
          window.location.href = "/home";
        } else {
          window.location.href = "/login";
        }
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Register";
      }
    });
  </script>
</body>
</html>
