<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - Teamwork LLM</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="page">
    <main class="centered">
      <div class="card">
        <h1 class="card-title">Sign In</h1>
        <p class="card-subtitle">Welcome back to Teamwork LLM</p>

        <div id="error-box" class="alert-error"></div>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input class="input" type="email" id="email" required placeholder="you@example.com" />
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="input" type="password" id="password" required placeholder="••••••••" />
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">Sign In</button>
        </form>

        <div class="form-footer">
          Don't have an account? <a href="/register">Register</a> &middot; <a href="/">Home</a>
        </div>
      </div>
    </main>
  </div>

  <script>
    if (localStorage.getItem("access_token")) {
      window.location.href = "/home";
    }

    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("error-box");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const body = new URLSearchParams();
      body.append("username", email);
      body.append("password", password);

      try {
        const res = await fetch("/auth/jwt/login", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: body.toString(),
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.detail || "Invalid email or password");
        }

        const data = await res.json();
        localStorage.setItem("access_token", data.access_token);
        window.location.href = "/home";
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
