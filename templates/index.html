<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teamwork LLM</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a href="/" class="logo">Teamwork <span>LLM</span></a>
      <nav class="topbar-right" id="nav-links">
        <a href="/login" class="btn btn-ghost">Sign In</a>
        <a href="/register" class="btn btn-primary">Get Started</a>
      </nav>
    </header>

    <main class="hero">
      <h1 class="hero-title">Collaborate with your team <span>&amp; AI</span></h1>
      <p class="hero-text">
        Create shared rooms, invite teammates, and work together with AI-assisted conversations and automatic summaries.
      </p>
      <div class="hero-actions">
        <a href="/register" class="btn btn-primary btn-lg" id="cta-primary">Create an Account</a>
        <a href="/login" class="btn btn-secondary btn-lg" id="cta-secondary">Sign In</a>
      </div>
    </main>
  </div>

  <script>
    const token = localStorage.getItem("access_token");
    if (token) {
      document.getElementById("nav-links").innerHTML = '<a href="/home" class="btn btn-primary">Go to Home</a>';
      const primaryBtn = document.getElementById("cta-primary");
      primaryBtn.href = "/home";
      primaryBtn.textContent = "Go to Your Rooms";
      document.getElementById("cta-secondary").style.display = "none";
    }
  </script>
</body>
</html>
