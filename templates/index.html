<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teamwork LLM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 2rem;
      border-bottom: 1px solid #1e293b;
    }
    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: #38bdf8;
      text-decoration: none;
    }
    nav a {
      color: #cbd5e1;
      text-decoration: none;
      margin-left: 1rem;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.95rem;
      transition: background 0.2s, color 0.2s;
    }
    nav a:hover { color: #fff; background: #1e293b; }
    nav a.primary {
      background: #0284c7;
      color: #fff;
      font-weight: 500;
    }
    nav a.primary:hover { background: #0369a1; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 2.75rem;
      margin-bottom: 1rem;
      color: #f1f5f9;
    }
    p {
      color: #94a3b8;
      max-width: 540px;
      line-height: 1.6;
      margin-bottom: 2rem;
      font-size: 1.1rem;
    }
    .actions {
      display: flex;
      gap: 1rem;
    }
    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #0284c7;
      color: #fff;
    }
    .btn-primary:hover { background: #0369a1; }
    .btn-secondary {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
    }
    .btn-secondary:hover { background: #334155; }
  </style>
</head>
<body>
  <header>
    <a href="/" class="logo">Teamwork LLM</a>
    <nav id="nav-links">
      <a href="/login">Sign In</a>
      <a href="/register" class="primary">Get Started</a>
    </nav>
  </header>

  <main>
    <h1>Collaborate with your team &amp; AI</h1>
    <p>
      Create shared rooms, invite teammates, and work together with AI-assisted conversations and automatic summaries.
    </p>
    <div class="actions">
      <a href="/register" class="btn btn-primary" id="cta-primary">Create an Account</a>
      <a href="/login" class="btn btn-secondary" id="cta-secondary">Sign In</a>
    </div>
  </main>

  <script>
    const token = localStorage.getItem("access_token");
    if (token) {
      document.getElementById("nav-links").innerHTML = '<a href="/home" class="primary">Go to Home</a>';
      const primaryBtn = document.getElementById("cta-primary");
      primaryBtn.href = "/home";
      primaryBtn.textContent = "Go to Your Rooms";
      document.getElementById("cta-secondary").style.display = "none";
    }
  </script>
</body>
</html>
