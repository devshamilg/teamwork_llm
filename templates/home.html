<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Rooms - Teamwork LLM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }
    .logo {
      font-size: 1.2rem;
      font-weight: 700;
      color: #38bdf8;
      text-decoration: none;
    }
    .user-bar {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.9rem;
      color: #cbd5e1;
    }
    .btn {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: #0284c7; color: #fff; }
    .btn-primary:hover { background: #0369a1; }
    .btn-logout {
      background: transparent;
      border: 1px solid #475569;
      color: #cbd5e1;
    }
    .btn-logout:hover { background: #334155; color: #fff; }
    main {
      max-width: 960px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    h1 { font-size: 1.6rem; }
    .new-room-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      display: none;
    }
    .new-room-card form {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .new-room-card input {
      flex: 1;
      min-width: 200px;
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
    }
    .rooms-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
    .room-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 1.25rem;
      transition: border-color 0.2s;
    }
    .room-card:hover { border-color: #38bdf8; }
    .room-card h3 {
      font-size: 1.15rem;
      margin-bottom: 0.4rem;
      color: #f1f5f9;
    }
    .room-card p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
      min-height: 1.2rem;
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      background: #0f172a;
      color: #38bdf8;
      border: 1px solid #334155;
    }
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: #94a3b8;
      background: #1e293b;
      border: 1px dashed #334155;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="logo">Teamwork LLM</a>
    <div class="user-bar">
      <span id="user-display">Loading...</span>
      <button class="btn btn-logout" id="logout-btn">Logout</button>
    </div>
  </header>

  <main>
    <div class="top-bar">
      <h1>Your Rooms</h1>
      <button class="btn btn-primary" id="toggle-create-btn">+ New Room</button>
    </div>

    <div class="new-room-card" id="create-room-box">
      <form id="create-room-form">
        <input type="text" id="room-name" required maxlength="100" placeholder="Room name" />
        <input type="text" id="room-desc" placeholder="Description (optional)" />
        <button type="submit" class="btn btn-primary">Create</button>
      </form>
    </div>

    <div id="rooms-container">
      <p style="color:#94a3b8;">Loading rooms...</p>
    </div>
  </main>

  <script>
    const token = localStorage.getItem("access_token");
    if (!token) {
      window.location.href = "/login";
    }

    const authHeaders = {
      "Authorization": `Bearer ${token}`,
      "Content-Type": "application/json",
    };

    async function loadUserAndRooms() {
      try {
        const meRes = await fetch("/api/me", { headers: authHeaders });
        if (meRes.status === 401) {
          localStorage.removeItem("access_token");
          window.location.href = "/login";
          return;
        }
        const user = await meRes.json();
        document.getElementById("user-display").textContent = `${user.display_name} (@${user.username})`;

        const roomsRes = await fetch("/api/rooms", { headers: authHeaders });
        const rooms = await roomsRes.json();
        renderRooms(rooms);
      } catch (err) {
        document.getElementById("rooms-container").innerHTML =
          `<div class="empty-state">Failed to load rooms.</div>`;
      }
    }

    function renderRooms(rooms) {
      const container = document.getElementById("rooms-container");
      if (!rooms || rooms.length === 0) {
        container.innerHTML = `<div class="empty-state">You don't have any rooms yet. Click "+ New Room" to create one.</div>`;
        return;
      }

      const grid = document.createElement("div");
      grid.className = "rooms-grid";

      rooms.forEach((r) => {
        const card = document.createElement("div");
        card.className = "room-card";
        card.innerHTML = `
          <h3></h3>
          <p></p>
          <span class="badge"></span>
        `;
        card.querySelector("h3").textContent = r.name;
        card.querySelector("p").textContent = r.description || "No description";
        card.querySelector(".badge").textContent = r.visibility;
        grid.appendChild(card);
      });

      container.innerHTML = "";
      container.appendChild(grid);
    }

    document.getElementById("toggle-create-btn").addEventListener("click", () => {
      const box = document.getElementById("create-room-box");
      box.style.display = box.style.display === "block" ? "none" : "block";
    });

    document.getElementById("create-room-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("room-name").value.trim();
      const description = document.getElementById("room-desc").value.trim() || null;

      const res = await fetch("/api/rooms", {
        method: "POST",
        headers: authHeaders,
        body: JSON.stringify({ name, description }),
      });

      if (res.ok) {
        document.getElementById("room-name").value = "";
        document.getElementById("room-desc").value = "";
        document.getElementById("create-room-box").style.display = "none";
        loadUserAndRooms();
      }
    });

    document.getElementById("logout-btn").addEventListener("click", async () => {
      await fetch("/auth/jwt/logout", { method: "POST", headers: authHeaders }).catch(() => {});
      localStorage.removeItem("access_token");
      window.location.href = "/login";
    });

    loadUserAndRooms();
  </script>
</body>
</html>
