<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Rooms - Teamwork LLM</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a href="/" class="logo">Teamwork <span>LLM</span></a>
      <div class="topbar-right">
        <div class="dropdown-wrapper">
          <button class="btn btn-ghost" id="notif-btn" type="button" title="Notifications" style="position:relative; font-size:1rem; padding:0.5rem 0.75rem;">
            🔔 <span id="notif-badge" class="notification-badge hidden">0</span>
          </button>
          <div class="dropdown-menu" id="notif-menu" style="width: 320px; max-height: 380px; overflow-y: auto;">
            <div class="dropdown-title">Notifications</div>
            <div id="notif-list">
              <div class="muted" style="font-size: 0.85rem; text-align: center; padding: 1rem 0;">No notifications</div>
            </div>
          </div>
        </div>
        <a href="/profile" class="btn btn-secondary" id="profile-btn">Profile</a>
      </div>
    </header>

    <main class="container">
      <div class="section-head">
        <h1 class="section-title">Rooms</h1>
        <button class="btn btn-primary" id="toggle-create-btn">+ New Room</button>
      </div>

      <div class="panel hidden" id="create-room-box">
        <form class="inline-form" id="create-room-form">
          <input class="input" type="text" id="room-name" required maxlength="100" placeholder="Room name" />
          <input class="input" type="text" id="room-desc" placeholder="Description (optional)" />
          <button type="submit" class="btn btn-primary">Create</button>
        </form>
      </div>

      <div id="rooms-container">
        <p class="muted">Loading rooms...</p>
      </div>
    </main>
  </div>

  <script>
    const token = localStorage.getItem("access_token");
    if (!token) {
      window.location.href = "/login";
    }

    const authHeaders = {
      "Authorization": `Bearer ${token}`,
      "Content-Type": "application/json",
    };

    function initials(name) {
      return (name || "?")
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2)
        .map((w) => w[0])
        .join("");
    }

    async function loadUserAndRooms() {
      try {
        const meRes = await fetch("/api/me", { headers: authHeaders });
        if (meRes.status === 401) {
          localStorage.removeItem("access_token");
          window.location.href = "/login";
          return;
        }

        const roomsRes = await fetch("/api/rooms", { headers: authHeaders });
        const rooms = await roomsRes.json();
        renderRooms(rooms);

        loadNotifications();
      } catch (err) {
        document.getElementById("rooms-container").innerHTML =
          `<div class="list empty-state">Failed to load rooms.</div>`;
      }
    }

    async function loadNotifications() {
      try {
        const res = await fetch("/api/notifications", { headers: authHeaders });
        if (!res.ok) return;
        const notifs = await res.json();

        const badge = document.getElementById("notif-badge");
        const list = document.getElementById("notif-list");

        if (notifs.length > 0) {
          badge.textContent = notifs.length;
          badge.classList.remove("hidden");

          list.innerHTML = notifs.map((n) => `
            <a href="/rooms/${n.room_id}" class="notification-item">
              <div>Invited to <strong>${escapeHtml(n.room_name)}</strong></div>
              <div class="notification-sub">by ${escapeHtml(n.invited_by)}</div>
            </a>
          `).join("");
        } else {
          badge.classList.add("hidden");
          list.innerHTML = `<div class="muted" style="font-size:0.85rem; text-align:center; padding:1rem 0;">No notifications</div>`;
        }
      } catch (err) {
        console.error("Failed to load notifications:", err);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text || "";
      return div.innerHTML;
    }

    // Dropdown toggle
    const notifBtn = document.getElementById("notif-btn");
    const notifMenu = document.getElementById("notif-menu");

    notifBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      notifMenu.classList.toggle("show");
    });

    notifMenu.addEventListener("click", (e) => {
      e.stopPropagation();
    });

    document.addEventListener("click", () => {
      notifMenu.classList.remove("show");
    });

    function renderRooms(rooms) {
      const container = document.getElementById("rooms-container");
      if (!rooms || rooms.length === 0) {
        container.innerHTML = `<div class="list empty-state">You don't have any rooms yet. Click "+ New Room" to create one.</div>`;
        return;
      }

      const list = document.createElement("div");
      list.className = "list";

      rooms.forEach((r) => {
        const item = document.createElement("div");
        item.className = "list-item";
        item.innerHTML = `
          <div class="avatar"></div>
          <div class="list-item-body">
            <div class="list-item-title"></div>
            <div class="list-item-sub"></div>
          </div>
          <span class="tag"></span>
        `;
        item.querySelector(".avatar").textContent = initials(r.name);
        item.querySelector(".list-item-title").textContent = r.name;
        item.querySelector(".list-item-sub").textContent = r.description || "No description";
        item.querySelector(".tag").textContent = r.visibility;
        item.addEventListener("click", () => {
          window.location.href = `/rooms/${r.id}`;
        });
        list.appendChild(item);
      });

      container.innerHTML = "";
      container.appendChild(list);
    }

    document.getElementById("toggle-create-btn").addEventListener("click", () => {
      document.getElementById("create-room-box").classList.toggle("hidden");
    });

    document.getElementById("create-room-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("room-name").value.trim();
      const description = document.getElementById("room-desc").value.trim() || null;

      const res = await fetch("/api/rooms", {
        method: "POST",
        headers: authHeaders,
        body: JSON.stringify({ name, description }),
      });

      if (res.ok) {
        document.getElementById("room-name").value = "";
        document.getElementById("room-desc").value = "";
        document.getElementById("create-room-box").classList.add("hidden");
        loadUserAndRooms();
      }
    });

    loadUserAndRooms();
  </script>
</body>
</html>
